services:
    app:
        image: ${APP_IMAGE:-dompetku-app:latest}
        build:
            context: .
            target: app
        restart: unless-stopped
        env_file: ${APP_ENV_FILE:-.env.production}
        depends_on:
            postgres: { condition: service_healthy }
            redis: { condition: service_healthy }
        volumes: ['app-storage:/var/www/html/storage/app']
        networks: [internal]
    worker:
        image: ${APP_IMAGE:-dompetku-app:latest}
        restart: unless-stopped
        command: php artisan queue:work --sleep=2 --tries=3 --timeout=120
        env_file: ${APP_ENV_FILE:-.env.production}
        depends_on: [app]
        volumes: ['app-storage:/var/www/html/storage/app']
        networks: [internal]
    scheduler:
        image: ${APP_IMAGE:-dompetku-app:latest}
        restart: unless-stopped
        command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
        env_file: ${APP_ENV_FILE:-.env.production}
        depends_on: [app]
        networks: [internal]
    nginx:
        image: ${WEB_IMAGE:-dompetku-web:latest}
        build:
            context: .
            target: web
        restart: unless-stopped
        ports: ['80:80']
        depends_on: [app]
        networks: [internal]
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes: ['postgres-data:/var/lib/postgresql/data']
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 10s
            timeout: 5s
            retries: 10
        networks: [internal]
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
        volumes: ['redis-data:/data']
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG',
                ]
            interval: 10s
            timeout: 5s
            retries: 10
        networks: [internal]
networks:
    internal:
        driver: bridge
volumes:
    postgres-data:
    redis-data:
    app-storage:
