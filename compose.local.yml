services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: dompetku
            POSTGRES_USER: dompetku
            POSTGRES_PASSWORD: dompetku-local
        ports: ['127.0.0.1:5432:5432']
        volumes: ['dompetku-postgres:/var/lib/postgresql/data']
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U dompetku -d dompetku']
            interval: 5s
            timeout: 5s
            retries: 10
    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        ports: ['127.0.0.1:6379:6379']
        volumes: ['dompetku-redis:/data']
volumes:
    dompetku-postgres:
    dompetku-redis:
